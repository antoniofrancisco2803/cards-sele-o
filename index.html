background-color: white;

}
a {
    text-decoration: none;
}
Header{ /*Cabeçalho*/
background-color: blue;
text-align: center; /* Coloca os textos ao centro*/
padding: 20px; /* Ajusta o espaçamento interno*/
color: white; /*Cor do texto*/
background-image: url(https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExbDdzbjdwYXNtOTNpNnp2NXByM25qeGs4Y2ZtdWNlM2ptaTY4bmoxdSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MZAHtPQ9EzeQKJilEq/giphy.gif);

margin: 0 30px;/*espaçamento lateral*/
text-decoration: none; /*remove o sublinhado*/
font-size: 20 px; /*tamanho da fonte*/
}
nav a:hover{ /*Quando o mouse passa sobre o link*/
text-decoration: underline; /*adiciona sublinhado*/
color: brown; /*Muda a cor*/


}
.fundo{ /*Container dos Cards*/
display: flex; /*Ativa a Flexbox*/
gap: 20px; /*Espaço entre os cards*/

justify-content: space-around; /*distribui os cards*/
margin-top: 10px; /*espaço acima*/
gap: 10px;
width: 100%;
height: 100%;
display: flex;
flex-wrap: wrap;
}
.card{ /*Card Individual*/
background-color: black; /*cor do card*/
color: yellow; /*Define uma cor para o texto do card*/
width: 250px; /*Largura fixa*/
height: 300px; /*altura Fixa*/
text-align: center; /*centraliza o texto*/
align-items: center; /*centraliza o conteudo*/
border-radius: 15px; /*cantos arredondados*/
padding: 10px; /*espaço interno*/
}
.card img{ /*imagem do card*/
width: 100%; /*ocupa toda a largura*/
height: 80%; /* ocupa 80% da altura*/
object-fit: cover; /* ajusta sem distorcer*/
border-radius: 15px; /*cantos arredondados*/
}
.card:hover{ /* efeito ao passar o mouse*/
transform: translateY(-10px) scale(1.02); /* move e aumenta*/
border-color: rgb(red, green, blue); /*cor da borda*/
box-shadow: 0 15px 20px rgb(red, green, blue); /* sombra*/
background-image: url(https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExODkyMjk4bnNjeGJ2YWUxZnlwaTV1ZGZxbG4wc3R6cGI2bnB1eTNnNiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/9Pmfazv34l7aNIKK05/giphy.gif);
}
